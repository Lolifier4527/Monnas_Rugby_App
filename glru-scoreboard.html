<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Monnas Rugby Live Scoreboard</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --gold:   #D9B23C;
  --gold-grad: linear-gradient(180deg, #fff6d8 0%, #f0d789 18%, #c99a2e 42%, #8a6414 58%, #eccd7c 76%, #b98a24 100%);
  --bg:     #060d1c;
  --panel:  #0f1c38;
  --border: rgba(217,178,60,0.22);
  --font-d: 'Bebas Neue', sans-serif;
  --font-b: 'DM Sans', sans-serif;
}

html, body {
  background: radial-gradient(ellipse 120% 65% at 50% -10%, #16294f 0%, var(--bg) 55%);
  color: #fff;
  font-family: var(--font-b);
  height: 100vh;
  overflow: hidden;
}

/* ── Top bar ── */
.topbar {
  background: rgba(16,32,63,0.97);
  border-bottom: 2px solid var(--gold);
  padding: 10px 28px;
  display: flex; align-items: center; justify-content: space-between;
  height: 58px;
  position: relative; z-index: 10;
}
.topbar-logo { height: 34px; object-fit: contain; }
.topbar-center { text-align: center; }
.topbar-title { font-family: var(--font-d); font-size: 26px; letter-spacing: 3px; line-height: 1; background: var(--gold-grad); -webkit-background-clip: text; background-clip: text; color: transparent; filter: drop-shadow(0 1px 1px rgba(0,0,0,0.4)); }
.topbar-sub { font-size: 11px; color: rgba(217,178,60,0.65); letter-spacing: 2px; margin-top: 1px; }
.topbar-right { display: flex; align-items: center; gap: 10px; }

/* ── Fields viewport ── */
#fields-area {
  display: flex;
  height: calc(100vh - 58px);
  width: 100%;
}

/* ── Field panel ── */
.field-panel {
  display: none;
  flex: 1;
  flex-direction: column;
  position: relative;
  border-right: 1px solid var(--border);
  overflow: hidden;
}
.field-panel:last-child { border-right: none; }
.field-panel.active { display: flex; }

/* ── Background glow ── */
.field-panel::before {
  content: '';
  position: absolute; inset: 0; z-index: 0;
  background:
    radial-gradient(ellipse 70% 60% at 50% 40%, rgba(11,31,58,0.35) 0%, transparent 70%),
    radial-gradient(ellipse 50% 40% at 80% 80%, rgba(217,178,60,0.04) 0%, transparent 60%);
  pointer-events: none;
}

/* ── Field header ── */
.field-header {
  position: relative; z-index: 2;
  text-align: center;
  padding: 14px 20px 8px;
  border-bottom: 1px solid var(--border);
}
.field-label {
  font-family: var(--font-d);
  letter-spacing: 4px;
  color: rgba(217,178,60,0.5);
}
.age-group-label {
  font-family: var(--font-d);
  letter-spacing: 2px;
  color: rgba(255,255,255,0.75);
  margin-top: 2px;
}

/* ── Score area ── */
.score-area {
  flex: 1; position: relative; z-index: 2;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  padding: 0 12px;
}
.teams-row {
  display: flex; align-items: center; justify-content: space-between;
  width: 100%; gap: 8px; margin-bottom: 6px;
}
.team-block { flex: 1; text-align: center; }
.team-name {
  font-family: var(--font-d);
  letter-spacing: 2px; line-height: 1.1;
  color: rgba(255,255,255,0.85);
  word-break: break-word;
}
.score-row {
  display: flex; align-items: center; justify-content: center;
  width: 100%;
}
.score-num {
  font-family: var(--font-d);
  line-height: 1; text-align: center;
  transition: color 0.4s; flex: 1;
}
.score-num.leader { background: var(--gold-grad); -webkit-background-clip: text; background-clip: text; color: transparent; filter: drop-shadow(0 3px 4px rgba(0,0,0,0.5)); }
.score-num.tied   { color: rgba(255,255,255,0.6); }
.score-vs-label {
  font-family: var(--font-d);
  color: rgba(217,178,60,0.4);
  flex: 0 0 auto; text-align: center;
}

/* ── Stats ── */
.stats-row {
  display: flex; gap: 6px; justify-content: center;
  flex-wrap: wrap; padding: 4px 12px 10px;
  position: relative; z-index: 2;
}
.stat-pill {
  background: rgba(255,255,255,0.06);
  border: 1px solid rgba(217,178,60,0.12);
  border-radius: 8px; padding: 6px 14px;
  font-size: clamp(11px, 1.8vw, 15px); color: rgba(255,255,255,0.5);
  white-space: nowrap;
}
.stat-pill .sv { color: rgba(217,178,60,0.8); font-weight: 700; }

/* ── Timer ── */
.break-row {
  position: relative; z-index: 2;
  text-align: center; padding: 0 12px 12px;
}
.timer-readout {
  font-family: var(--font-d);
  color: rgba(217,178,60,0.55);
  letter-spacing: 3px;
}

/* ── Half time overlay ── */
.halftime-overlay {
  position: absolute; inset: 0; z-index: 50;
  background: linear-gradient(160deg,#0a1428 0%,#10203f 100%);
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  opacity: 0; pointer-events: none;
  transition: opacity 0.45s;
  gap: 18px;
}
.halftime-overlay.active { opacity: 1; pointer-events: all; }
.halftime-logo { height: clamp(50px, 9vw, 110px); object-fit: contain; }
.halftime-text {
  font-family: var(--font-d);
  font-size: clamp(40px, 9vw, 90px);
  letter-spacing: 8px;
  animation: htPulse 2s infinite;
  background: var(--gold-grad); -webkit-background-clip: text; background-clip: text; color: transparent;
  filter: drop-shadow(0 2px 3px rgba(0,0,0,0.5));
}
.halftime-score-row {
  display: flex; align-items: center; justify-content: center;
  gap: clamp(16px, 4vw, 48px);
}
.halftime-team { text-align: center; }
.halftime-team-name {
  font-family: var(--font-d);
  font-size: clamp(18px, 3vw, 38px);
  color: rgba(255,255,255,0.8);
  letter-spacing: 2px;
}
.halftime-team-score {
  font-family: var(--font-d);
  font-size: clamp(60px, 12vw, 160px);
  color: #fff;
  line-height: 1;
  text-shadow: 0 3px 6px rgba(0,0,0,0.5);
}
.halftime-vs {
  font-family: var(--font-d);
  font-size: clamp(24px, 4vw, 48px);
  color: rgba(217,178,60,0.6);
}
@keyframes htPulse { 0%,100%{opacity:0.9} 50%{opacity:0.5} }

/* ── Font sizes: single panel ── */
#fields-area .field-label     { font-size: clamp(14px, 1.6vw, 22px); }
#fields-area .age-group-label { font-size: clamp(24px, 4vw,  52px); }
#fields-area .team-name       { font-size: clamp(28px, 5vw,  72px); }
#fields-area .score-num       { font-size: clamp(110px,18vw,260px); }
#fields-area .score-vs-label  { font-size: clamp(32px, 5vw,  72px); }
#fields-area .timer-readout   { font-size: clamp(22px, 3vw,  44px); }

/* ── Waiting screen ── */
#waiting {
  position: fixed; inset: 0; z-index: 5;
  background: var(--bg);
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  gap: 16px;
}
#waiting .wt { font-family: var(--font-d); font-size: 48px; color: var(--gold); letter-spacing: 4px; }
#waiting .ws { font-size: 14px; color: rgba(217,178,60,0.4); letter-spacing: 2px; }
.spinner {
  width: 44px; height: 44px; border-radius: 50%;
  border: 4px solid rgba(217,178,60,0.2);
  border-top-color: var(--gold);
  animation: spin 0.9s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<!-- TOP BAR -->
<div class="topbar">
  <img src="monnas_logo.png" alt="Monnas" class="topbar-logo" onerror="this.style.display='none'">
  <div class="topbar-center">
    <div class="topbar-title">MONNAS RUGBY</div>
    <div class="topbar-sub" id="topbar-sub">LIVE SCOREBOARD</div>
  </div>
  <div class="topbar-right">
    <button onclick="toggleFullscreen()" id="fs-btn" title="Fullscreen" style="background:none;border:1px solid rgba(217,178,60,0.3);border-radius:8px;color:rgba(217,178,60,0.7);padding:5px 8px;cursor:pointer;font-size:16px;line-height:1;">⛶</button>
  </div>
</div>

<!-- FIELD PANEL (built by JS) -->
<div id="fields-area"></div>

<!-- WAITING -->
<div id="waiting">
  <img src="monnas_logo.png" alt="Monnas" style="height:64px;object-fit:contain;margin-bottom:4px" onerror="this.style.display='none'">
  <div class="spinner"></div>
  <div class="wt">MONNAS RUGBY</div>
  <div class="ws">WAITING FOR LIVE SCORE DATA...</div>
</div>

<script src="https://cdn.ably.com/lib/ably.min-2.js"></script>
<script>
// ═══════════════════════════════════════════════════════════════
//  CONFIG
// ═══════════════════════════════════════════════════════════════
const ABLY_API_KEY = 'SJFVyA.6xbCgA:eC0ANlFJXsRkukat8SN8RMo1ephqll_ij7XAYgC1Q38';
const ABLY_CHANNEL = 'glru-scoreboard';

// ═══════════════════════════════════════════════════════════════
//  BUILD DOM — single panel
// ═══════════════════════════════════════════════════════════════
const area = document.getElementById('fields-area');
area.classList.add('solo');
area.innerHTML = `
  <div class="field-panel active" id="panel">
    <div class="field-header">
      <div class="age-group-label" id="panel-age"></div>
    </div>
    <div class="score-area">
      <div class="teams-row">
        <div class="team-block"><div class="team-name" id="panel-home">HOME</div></div>
        <div style="flex:0 0 24px"></div>
        <div class="team-block"><div class="team-name" id="panel-away">AWAY</div></div>
      </div>
      <div class="score-row">
        <div class="score-num tied" id="panel-sf">0</div>
        <div class="score-vs-label" id="panel-vs">–</div>
        <div class="score-num tied" id="panel-sa">0</div>
      </div>
    </div>
    <div class="break-row">
      <div class="timer-readout" id="panel-timer"></div>
    </div>
    <div class="stats-row" id="panel-stats"></div>
    <div class="halftime-overlay" id="panel-ht">
      <img src="monnas_logo.png" alt="Monnas" class="halftime-logo" onerror="this.style.display='none'">
      <div class="halftime-text">HALF TIME</div>
      <div class="halftime-score-row">
        <div class="halftime-team">
          <div class="halftime-team-name" id="panel-ht-home">HOME</div>
          <div class="halftime-team-score" id="panel-ht-sf">0</div>
        </div>
        <div class="halftime-vs">–</div>
        <div class="halftime-team">
          <div class="halftime-team-name" id="panel-ht-away">AWAY</div>
          <div class="halftime-team-score" id="panel-ht-sa">0</div>
        </div>
      </div>
    </div>
  </div>
`;

// ═══════════════════════════════════════════════════════════════
//  RENDER
// ═══════════════════════════════════════════════════════════════
function timerFmt(s) {
  if (s == null) return '';
  return String(Math.floor(s/60)).padStart(2,'0') + ':' + String(s%60).padStart(2,'0');
}

let latestData = {};

function render() {
  const data = latestData;

  // Age
  document.getElementById('panel-age').textContent = data.ageGroup || '';

  // Teams
  const home = (data.homeTeam || 'HOME').toUpperCase();
  const away = (data.opposingTeam || 'AWAY').toUpperCase();
  document.getElementById('panel-home').textContent = home;
  document.getElementById('panel-away').textContent = away;
  document.getElementById('panel-ht-home').textContent = home;
  document.getElementById('panel-ht-away').textContent = away;

  // Scores
  const f = data.totalFor ?? 0, a = data.totalAgainst ?? 0;
  const sfEl = document.getElementById('panel-sf');
  const saEl = document.getElementById('panel-sa');
  sfEl.textContent = f; sfEl.className = 'score-num ' + (f > a ? 'leader' : 'tied');
  saEl.textContent = a; saEl.className = 'score-num ' + (a > f ? 'leader' : 'tied');
  document.getElementById('panel-ht-sf').textContent = f;
  document.getElementById('panel-ht-sa').textContent = a;

  // Stats
  document.getElementById('panel-stats').innerHTML = `
    <div class="stat-pill">T <span class="sv">${data.triesFor??0}–${data.triesAgainst??0}</span></div>
    <div class="stat-pill">C <span class="sv">${data.conversionsFor??0}–${data.conversionsAgainst??0}</span></div>
    <div class="stat-pill">P <span class="sv">${data.penaltiesFor??0}–${data.penaltiesAgainst??0}</span></div>
    <div class="stat-pill">DK <span class="sv">${data.dropKicksFor??0}–${data.dropKicksAgainst??0}</span></div>
  `;

  // Timer
  document.getElementById('panel-timer').textContent = timerFmt(data.timerSeconds);

  // Blank / half time
  document.getElementById('panel-ht').classList.toggle('active', !!data.blanked);
}

// ═══════════════════════════════════════════════════════════════
//  HANDLE INCOMING STATE
// ═══════════════════════════════════════════════════════════════
function handleState(data) {
  latestData = data;
  render();
  document.getElementById('waiting').style.display = 'none';
}

// ═══════════════════════════════════════════════════════════════
//  ABLY
// ═══════════════════════════════════════════════════════════════
// ── Fullscreen ────────────────────────────────────────────────
function toggleFullscreen() {
  const btn = document.getElementById('fs-btn');
  if (!document.fullscreenElement) {
    document.documentElement.requestFullscreen().catch(() => {});
    if (btn) btn.textContent = '✕';
  } else {
    document.exitFullscreen().catch(() => {});
    if (btn) btn.textContent = '⛶';
  }
}
document.addEventListener('fullscreenchange', () => {
  const btn = document.getElementById('fs-btn');
  if (btn) btn.textContent = document.fullscreenElement ? '✕' : '⛶';
});

const ably = new Ably.Realtime({ key: ABLY_API_KEY, clientId: 'scoreboard-display' });
const ch   = ably.channels.get(ABLY_CHANNEL);

ably.connection.on('connected', async () => {
  try {
    const page = await ch.history({ limit: 40 });
    page.items.slice().reverse().forEach(msg => {
      if (msg.name === 'state' && msg.data) handleState(msg.data);
    });
  } catch(e) { console.warn('History fetch failed', e); }
});

ch.subscribe('state', msg => {
  if (msg.data) handleState(msg.data);
});

</script>
</body>
</html>
